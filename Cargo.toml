[package]
name = "testcontainers-magento-data"
description = "Test-Containers for Quick Magento Development"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ecomdev/testcontainer-magento-data-rust"
rust-version = "1.94.0"

[dependencies]
testcontainers = { version = "0.28.0" }
tokio = { version = "1", features = ["macros", "io-util"] }
env-file-reader = { version = "0.3.0" }

[features]
blocking = ["testcontainers/blocking"]
watchdog = ["testcontainers/watchdog"]

[dev-dependencies]
sqlx = { version = "0.9.1", features = [ "runtime-tokio", "tls-rustls-ring-native-roots", "mysql" ] }
